<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>結構物估驗盤點</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#E9EDF1; --surface:#FFFFFF; --surface-2:#F6F8FA; --sunken:#DFE5EB;
  --ink:#131B23; --ink-2:#3F4C59; --muted:#6B7A88;
  --rule:#C9D2DB; --rule-soft:#E2E8EE;
  --accent:#17496B; --accent-2:#2E6E96; --accent-soft:#E3EDF4;
  --done:#2D6A4F; --done-bg:#E1EFE7;
  --prog:#8A5A00; --prog-bg:#FAF0D9;
  --none:#5B6B7B; --none-bg:#E6EBF0;
  --over:#A32B33; --over-bg:#FAE3E4;
  --pend:#4A5A8A; --pend-bg:#E7EAF5;
  --shadow:0 1px 2px rgba(19,27,35,.07),0 10px 28px -20px rgba(19,27,35,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A1015; --surface:#141C24; --surface-2:#101820; --sunken:#0D141A;
  --ink:#E2E9F0; --ink-2:#AEBCC9; --muted:#8294A3;
  --rule:#27323D; --rule-soft:#1C242D;
  --accent:#7FB3D9; --accent-2:#A7CBE6; --accent-soft:#162835;
  --done:#7FC9A3; --done-bg:#112419;
  --prog:#DCA845; --prog-bg:#2A2211;
  --none:#93A4B4; --none-bg:#1A222A;
  --over:#E58189; --over-bg:#2D1618;
  --pend:#9BA7D6; --pend-bg:#1A1E2E;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -22px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --paper:#0A1015; --surface:#141C24; --surface-2:#101820; --sunken:#0D141A;
  --ink:#E2E9F0; --ink-2:#AEBCC9; --muted:#8294A3;
  --rule:#27323D; --rule-soft:#1C242D;
  --accent:#7FB3D9; --accent-2:#A7CBE6; --accent-soft:#162835;
  --done:#7FC9A3; --done-bg:#112419;
  --prog:#DCA845; --prog-bg:#2A2211;
  --none:#93A4B4; --none-bg:#1A222A;
  --over:#E58189; --over-bg:#2D1618;
  --pend:#9BA7D6; --pend-bg:#1A1E2E;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2{font-family:"Noto Serif TC",Georgia,serif;margin:0;text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 80px}

/* title block */
header{background:var(--surface);border-bottom:1px solid var(--rule)}
.tb{max-width:1320px;margin:0 auto;padding:26px 20px 0;
 display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end}
.tb .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);
 font-family:"IBM Plex Mono",monospace;font-weight:500;text-transform:uppercase}
.tb h1{font-size:27px;font-weight:700;line-height:1.3;margin-top:6px}
.tb .per{font-size:12.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;text-align:right;padding-bottom:4px}
.ledger{max-width:1320px;margin:20px auto 0;padding:0 20px;
 display:grid;grid-template-columns:repeat(auto-fit,minmax(174px,1fr));border-top:1px solid var(--rule-soft)}
.ledger>div{padding:12px 11px 15px;border-right:1px solid var(--rule-soft);min-width:0}
.ledger>div:last-child{border-right:0}
.ledger .k{font-size:11px;letter-spacing:.07em;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.ledger .v{font-size:clamp(13.5px,1.2vw,16.5px);font-weight:600;font-family:"IBM Plex Mono",monospace;
 font-variant-numeric:tabular-nums;line-height:1.3;margin-top:2px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.ledger .v small{font-size:.62em;font-weight:500;color:var(--muted);margin-right:3px}
.ledger .s{font-size:11.5px;color:var(--muted)}
.ledger .hl .v{color:var(--accent)} .ledger .warn .v{color:var(--prog)} .ledger .crit .v{color:var(--over)}

/* alerts */
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.alert{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--rule);
 border-left:3px solid var(--over);border-radius:2px;padding:9px 14px;font-size:13px;cursor:pointer;
 color:var(--ink);text-align:left}
.alert.w{border-left-color:var(--prog)} .alert.i{border-left-color:var(--pend)}
.alert b{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--over)}
.alert.w b{color:var(--prog)} .alert.i b{color:var(--pend)}
.alert:hover{background:var(--surface-2)}
.alert:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* control bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);
 padding:14px 0 12px;margin-top:18px;border-bottom:1px solid var(--rule);
 display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--surface)}
.seg button{font:600 13px/1 "Noto Sans TC",sans-serif;padding:9px 16px;border:0;background:transparent;
 color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0A1015}
select,input[type="search"],input,textarea{font:400 13px/1.4 "Noto Sans TC",sans-serif;
 padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink)}
input[type="search"]{min-width:200px}
button.act{font:600 13px/1 "Noto Sans TC",sans-serif;padding:9px 15px;border:1px solid var(--accent);
 background:var(--accent);color:#fff;border-radius:2px;cursor:pointer}
:root[data-theme="dark"] button.act,:root:not([data-theme="light"]) button.act{color:#0A1015}
button.ghost{font:500 13px/1 "Noto Sans TC",sans-serif;padding:9px 13px;border:1px solid var(--rule);
 background:var(--surface);color:var(--ink-2);border-radius:2px;cursor:pointer}
.count{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-left:auto}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* group section */
.gsec{margin-top:22px}
.ghead{display:flex;align-items:baseline;gap:12px;padding:0 2px 8px;border-bottom:2px solid var(--accent)}
.ghead h2{font-size:16.5px;font-weight:600}
.ghead .gm{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-left:auto}

/* structure row */
.srow{background:var(--surface);border:1px solid var(--rule);border-top:0;
 display:grid;grid-template-columns:minmax(170px,1.5fr) 92px 1fr 128px 128px 92px 110px 26px;
 gap:12px;align-items:center;padding:11px 14px;cursor:pointer;width:100%;text-align:left;
 font:inherit;color:inherit}
.ghead+.srow{border-top:1px solid var(--rule)}
.xbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:2px;
 color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.xbtn:hover{background:var(--over-bg);color:var(--over)}
td .xbtn{width:20px;height:20px}
.srow:hover{background:var(--surface-2)}
.srow .nm{font-family:"Noto Serif TC",serif;font-weight:600;font-size:14.5px;display:flex;gap:7px;align-items:center}
.srow .nm .tw{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);font-weight:400}
.srow .pct{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:right}
.track{height:9px;background:var(--sunken);border-radius:1px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--accent);border-radius:1px}
.track.ovr i{background:var(--over)}
.srow .num{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;color:var(--ink-2)}
.srow .num em{display:block;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;white-space:nowrap;
 font-family:"IBM Plex Mono",monospace;font-weight:500;text-align:center}
.p-done{background:var(--done-bg);color:var(--done)} .p-prog{background:var(--prog-bg);color:var(--prog)}
.p-none{background:var(--none-bg);color:var(--none)} .p-over{background:var(--over-bg);color:var(--over)}
.p-pend{background:var(--pend-bg);color:var(--pend)}
.detail{background:var(--surface-2);border:1px solid var(--rule);border-top:0;padding:4px 14px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.05em;color:var(--muted);
 padding:9px 9px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;font-family:"IBM Plex Mono",monospace}
td{padding:7px 9px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px;
 background:var(--surface);border:1px solid var(--rule)}

/* log panel */
.sheet{position:fixed;inset:0;background:rgba(10,16,21,.5);display:none;z-index:50;
 align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.sheet[data-open="1"]{display:flex}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);
 width:100%;max-width:560px;padding:22px 24px 24px}
.card h2{font-size:18px;font-weight:600;margin-bottom:4px}
.card p.sub{font-size:13px;color:var(--ink-2);margin:0 0 18px}
.fld{display:grid;gap:5px;margin-bottom:13px}
.fld label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.fld input,.fld select,.fld textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.msg{font-size:12.5px;padding:8px 11px;border-radius:2px;margin-bottom:12px;display:none}
.msg.err{display:block;background:var(--over-bg);color:var(--over)}
.msg.ok{display:block;background:var(--done-bg);color:var(--done)}
.cta{display:flex;gap:9px;justify-content:flex-end;margin-top:6px}
.logs{margin-top:16px;border-top:1px solid var(--rule-soft);padding-top:12px;max-height:210px;overflow-y:auto}
.logline{display:grid;grid-template-columns:44px 1fr auto auto;gap:9px;font-size:12px;padding:5px 0;
 border-bottom:1px solid var(--rule-soft);align-items:center}
.logline .n{font-size:12px}
.logline button{border:0;background:transparent;color:var(--over);cursor:pointer;font-size:11.5px;padding:2px 5px}
.card.wide{max-width:860px}
.drop{border:1px dashed var(--rule);border-radius:3px;padding:14px;margin-bottom:12px;
 display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--sunken)}
.drop span.t{font-size:12.5px;color:var(--ink-2)}
#impText{width:100%;min-height:92px;font:400 12px/1.5 "IBM Plex Mono",monospace;resize:vertical}
.ihead{font-size:12.5px;margin:12px 0 7px;color:var(--ink-2)}
.itbl{max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:2px}
.itbl th{position:sticky;top:0;background:var(--surface);z-index:1}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px}
@media(max-width:900px){
 .srow{grid-template-columns:minmax(0,1fr) 62px 78px 22px;gap:6px;padding:11px 10px}
 .srow .pill{font-size:10px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
 .srow .nm{font-size:13px;min-width:0}
 .ledger{padding:0 14px}
 .srow .track,.srow .num.hideS{display:none}
 .tb{grid-template-columns:1fr}.tb .per{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
 <div class="tb">
  <div>
   <div class="eyebrow">西屯區市政路延伸工程 第2標 · 安和路至環中路三段</div>
   <h1>結構物估驗盤點</h1>
  </div>
  <div class="per" id="perTxt"></div>
 </div>
 <div class="ledger" id="ledger"></div>
</header>

<div class="wrap">
 <div class="alerts" id="alerts"></div>

 <div class="bar">
  <div class="seg" role="group" aria-label="視角">
   <button id="vStruct" aria-pressed="true">結構物視角</button>
   <button id="vItem" aria-pressed="false">項次視角</button>
   <button id="vChk" aria-pressed="false">三方檢核</button>
  </div>
  <select id="fGroup"><option value="">全部結構群組</option></select>
  <select id="fComp" title="構件"><option value="">全部構件</option></select>
  <select id="fStatus">
   <option value="">全部狀態</option>
   <option value="done">已估驗完成</option>
   <option value="prog">進行中</option>
   <option value="none">未開始估驗</option>
   <option value="over">⚠ 超估</option>
   <option value="pend">施工圖待補</option>
  </select>
  <select id="fSort" title="排序">
   <option value="nat">依名稱順序（節塊依編號）</option>
   <option value="pct">依完成率</option>
   <option value="amt">依已請款金額</option>
   <option value="left">依尚未估驗金額</option>
  </select>
  <input type="search" id="q" placeholder="搜尋結構物／項次／品名…">
  <button class="act" id="btnLog">＋ 登錄估驗</button>
  <button class="ghost" id="btnImport">匯入 Excel</button>
  <select id="expPer" title="匯出哪一期" style="display:none"></select>
  <button class="ghost" id="btnExport">匯出登錄</button>
  <button class="ghost" id="btnHid" aria-pressed="false" style="display:none">顯示已排除 (0)</button>
  <span class="count" id="cnt"></span>
 </div>

 <div id="view"></div>

 <footer id="foot"></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
 <div class="card">
  <h2 id="shT">登錄估驗數量</h2>
  <p class="sub">契約 843 項全部可選。登錄後「已估驗」立刻加上這筆，完成率與狀態同步更新；資料存在這個頁面上，下次打開還在。</p>
  <div class="msg" id="msg"></div>
  <div class="row2">
   <div class="fld"><label for="fPer">估驗期別</label><input id="fPer" type="number" min="1" max="60" step="1"></div>
   <div class="fld"><label for="fQty">數量</label><input id="fQty" type="number" step="any" placeholder="例 388"></div>
  </div>
  <div class="fld"><label for="fCode">契約項次</label><input id="fCode" list="dlCode" placeholder="壹.一.1.1.1"><datalist id="dlCode"></datalist></div>
  <div class="fld"><label for="fPart">結構物</label><input id="fPart" list="dlPart" placeholder="B01節塊#10"><datalist id="dlPart"></datalist>
   <div class="hint" id="partHint"></div></div>
  <div class="fld"><label for="fNote">備註／計算式</label><input id="fNote" placeholder="選填"></div>
  <div class="cta">
   <button class="ghost" id="btnClose">取消</button>
   <button class="act" id="btnSave">登錄</button>
  </div>
  <div class="logs" id="logList"></div>
 </div>
</div>

<div class="sheet" id="imp" role="dialog" aria-modal="true" aria-labelledby="impT">
 <div class="card wide">
  <h2 id="impT">從 Excel 匯入估驗登錄</h2>
  <p class="sub">兩種方式都行：直接丟 .xlsx／.csv 檔，或在 Excel 選取範圍 Ctrl+C 後貼到下面的框。
   會自動認表頭（期別／項次／結構物／數量／備註），逐列檢查不得超過施工圖與合約，重複的自動略過。</p>
  <div class="msg" id="impMsg"></div>
  <div class="drop">
   <input type="file" id="impFile" accept=".xlsx,.csv,.txt">
   <span class="t">選 .xlsx 會讓你挑分頁</span>
   <select id="sheetPick" style="display:none"></select>
  </div>
  <textarea id="impText" placeholder="在 Excel 選取要匯入的列（含表頭那一列最好），Ctrl+C，然後點這裡 Ctrl+V"></textarea>
  <div class="cta" style="margin-top:8px">
   <button class="ghost" id="btnPaste">解析貼上的內容</button>
  </div>
  <div id="impPrev"></div>
  <div class="cta">
   <button class="ghost" id="impClose">關閉</button>
   <button class="act" id="btnDoImp" disabled>匯入</button>
  </div>
 </div>

const NK=s=>String(s==null?'':s).split(/(\d+)/).filter(t=>t!=='').map((t,i)=>/^\d+$/.test(t)?{n:+t}:t);
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔';
const gord=g=>{const i=CIRC.indexOf(String(g)[0]);return i<0?99:i;};
const gcmp=(a,b)=>gord(a)-gord(b)||natcmp(a,b);
function natcmp(a,b){
  const A=NK(a),B=NK(b),L=Math.max(A.length,B.length);
  for(let i=0;i<L;i++){
    const x=A[i],y=B[i];
    if(x===undefined) return -1; if(y===undefined) return 1;
    const xn=typeof x==='object', yn=typeof y==='object';
    if(xn&&yn){ if(x.n!==y.n) return x.n-y.n; continue; }
    if(xn!==yn) return xn?-1:1;
    const r=x.localeCompare(y,'zh-Hant'); if(r) return r;
  }
  return 0;
}

  }

function extra(code,part){let s=0;for(const l of LOGS) if(l.code===code&&l.part===part) s+=(+l.qty||0);return s;}
function extraPers(code,part){return LOGS.filter(l=>l.code===code&&l.part===part).map(l=>+l.period).filter(Boolean);}
const sKey=(g,part)=>'S:'+g+'\u0000'+part;
const iKey=code=>'I:'+code;
async function saveHidden(){
  if(!db) return;

}

/* ---- 計算 ---- */
function cellState(c){
  const est=c.est0+(c.pend||0)+extra(c.code,c.part);
  if(c.dwg===null||c.dwg===undefined) return {est,st:'pend',label:'施工圖待補',left:null};
  if(est>c.dwg+0.01) return {est,st:'over',label:'⚠ 超估',left:0};
  if(est<=0.000001) return {est,st:'none',label:'未估驗',left:c.dwg};
  if(est<c.dwg-0.01) return {est,st:'prog',label:'部分估驗',left:c.dwg-est};
  return {est,st:'done',label:'已估完',left:0};
}
function buildStructs(){
  const m=new Map();
  for(const c of C){
    if(SPECIAL(c.g)) continue;
    const k=c.g+'\u0000'+c.part;
    let s=m.get(k);
    if(!s){s={g:c.g,part:c.part,comp:c.comp||'',key:sKey(c.g,c.part),cells:[],billed:0,billedCap:0,capAmt:0,leftAmt:0,over:0,nEst:0,pend:0,pers:[],pendAmt:0};m.set(k,s);}
    if(!s.comp&&c.comp) s.comp=c.comp;
    const r=cellState(c);
    s.cells.push(c);
    s.billed+=c.est0*c.price;
    s.pendAmt+=((c.pend||0)+extra(c.code,c.part))*c.price;
    if(c.dwg!==null&&c.dwg!==undefined){s.capAmt+=c.dwg*c.price; s.billedCap+=c.est0*c.price;
      s.leftAmt+=Math.max(0,c.dwg-r.est)*c.price;}
    else s.pend++;
    if(r.st==='over') s.over++;
    if(r.est>0.000001) s.nEst++;
    s.pers.push(...c.pers, ...extraPers(c.code,c.part));
  }
  for(const s of m.values()){
    s.cells.sort((a,b)=>natcmp(a.code,b.code));
    s.pct = s.capAmt>0 ? Math.min(1,s.billedCap/s.capAmt) : null;
    s.st = s.over>0 ? 'over' : (s.nEst===0 ? 'none' : (s.capAmt===0 ? 'pend' :
           (s.billedCap>=s.capAmt*0.995 ? 'done' : 'prog')));
    s.label = {over:'⚠ 有超估',none:'未開始估驗',pend:'施工圖待補',done:'已估驗完成',prog:'進行中'}[s.st];
    const p=[...new Set(s.pers)].sort((a,b)=>a-b);
    s.perTxt = p.length ? (p[0]===p[p.length-1] ? '第'+p[0]+'期' : '第'+p[0]+'~'+p[p.length-1]+'期') : '—';
  }
  return [...m.values()];
}

  if(unal) A.push(['i','未分攤 '+unal+' 項','款已請到但還沒分到結構物','unal']);
  if(pend) A.push(['w','施工圖待補 '+pend+' 筆','補了才判得出未估驗量','pendc']);

function validate(period,code,part,q0){
  if(!(period>=1&&period<=60)) return '估驗期別請填 1~60 的數字。';
  if(!Number.isFinite(q0)||q0===0) return '數量請填非零數字（扣除請填負數）。';

  if(!it) return '契約沒有「'+code+'」這個項次。';
  if(!part) return '請填結構物名稱。';
  const cell=C.find(c=>c.code===code&&c.part===part);
  if(cell&&cell.dwg!==null&&cell.dwg!==undefined){
    const after=cell.est0+extra(code,part)+q0;

      return '登錄後該部位已估 '+qty(after)+' 會超過施工圖數量 '+qty(cell.dwg)+'（超 '+qty(after-cell.dwg)+'），不符「不得多於施工圖」原則。';

  return '';
}

/* --- 迷你 xlsx 讀取器（zip + DecompressionStream，不依賴外部函式庫） --- */
async function xlsxSheets(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eo=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error('這不是有效的 .xlsx 檔');
  const n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  const F={}; let p=cd;
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    F[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};
    p+=46+nl+el+cl;
  }
  async function rd(name){
    const f=F[name]; if(!f) return null;
    const ln=dv.getUint16(f.lho+26,true), le=dv.getUint16(f.lho+28,true);
    const d=u8.subarray(f.lho+30+ln+le, f.lho+30+ln+le+f.csize);
    if(f.method===0) return new TextDecoder().decode(d);
    if(f.method!==8) throw new Error('不支援的壓縮格式');
    const st=new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(st).text();
  }
  const P=new DOMParser();
  const wbx=await rd('xl/workbook.xml'); if(!wbx) throw new Error('讀不到 workbook.xml');
  const rels=await rd('xl/_rels/workbook.xml.rels')||'';
  const rmap={};
  P.parseFromString(rels,'application/xml').querySelectorAll('Relationship').forEach(r=>{
    let t=r.getAttribute('Target')||''; if(t.startsWith('/xl/'))t=t.slice(4); if(t.startsWith('/'))t=t.slice(1);
    rmap[r.getAttribute('Id')]=t.startsWith('xl/')?t:'xl/'+t;
  });
  const sst=[]; const ssx=await rd('xl/sharedStrings.xml');
  if(ssx) P.parseFromString(ssx,'application/xml').querySelectorAll('si').forEach(si=>{
    let s=''; si.querySelectorAll('t').forEach(t=>{s+=t.textContent;}); sst.push(s);
  });
  const sheets=[];
  P.parseFromString(wbx,'application/xml').querySelectorAll('sheets > sheet, sheet').forEach(sh=>{
    const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')
            ||sh.getAttribute('r:id');
    const st=sh.getAttribute('state')||'visible';
    if(rmap[rid]) sheets.push({name:sh.getAttribute('name'),path:rmap[rid],hidden:st!=='visible'});
  });
  async function grid(path){
    const x=await rd(path); if(!x) return [];
    const doc=P.parseFromString(x,'application/xml'); const out=[];
    doc.querySelectorAll('sheetData > row').forEach(row=>{
      const r=+row.getAttribute('r')||out.length+1; const arr=out[r-1]||(out[r-1]=[]);
      row.querySelectorAll('c').forEach(c=>{
        const ref=c.getAttribute('r')||''; const m=ref.match(/^([A-Z]+)/);
        let ci=0; if(m){for(const ch of m[1]) ci=ci*26+(ch.charCodeAt(0)-64);} ci--;
        const t=c.getAttribute('t'); let v=null;
        if(t==='inlineStr'){ let s=''; c.querySelectorAll('is t').forEach(e=>s+=e.textContent); v=s; }
        else { const ve=c.querySelector('v'); if(ve){ v = t==='s' ? (sst[+ve.textContent]||'') : ve.textContent; } }
        if(v!==null&&ci>=0) arr[ci]=v;
      });
    });
    for(let i=0;i<out.length;i++) if(!out[i]) out[i]=[];
    return out;
  }
  return {sheets,grid};
}
function parseDelim(text){
  const t=text.replace(/\r\n?/g,'\n').replace(/\n+$/,'');
  if(!t.trim()) return [];
  const tab=t.includes('\t');
  if(tab) return t.split('\n').map(l=>l.split('\t'));
  const rows=[]; let row=[],cur='',qd=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(qd){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else qd=false; } else cur+=ch; }
    else if(ch==='"') qd=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  row.push(cur); rows.push(row);
  return rows;
}
const HDR={per:/期別|期數|^期$|核定期/, code:/項次|合約編號|編號|工項/, part:/結構物|結構部位|部位/,
           qty:/數量|總計|小計|估驗量/, note:/備註|說明|計算式|算式/};
function mapRows(grid){
  // 找表頭列
  let hr=-1, map=null;
  for(let i=0;i<Math.min(grid.length,30);i++){
    const row=(grid[i]||[]).map(v=>String(v==null?'':v).trim());
    const m={};
    row.forEach((v,j)=>{ for(const k in HDR) if(m[k]===undefined&&HDR[k].test(v)) m[k]=j; });
    if(m.code!==undefined&&m.qty!==undefined&&m.part!==undefined){ hr=i; map=m; break; }
  }
  const body = hr>=0 ? grid.slice(hr+1) : grid;
  if(!map) map={per:0,code:1,part:2,qty:3,note:4};
  const out=[];
  for(const row of body){
    const g=j=>j===undefined?'':String(row[j]==null?'':row[j]).trim();
    const code=g(map.code), part=g(map.part);
    const qs=g(map.qty).replace(/,/g,'');
    if(!code&&!part&&!qs) continue;
    const num=parseFloat(qs);
    const pm=g(map.per).match(/\d+/);
    out.push({period:pm?+pm[0]:(KPI.base+1), code, part, qty:num, note:g(map.note)});
  }
  return out;
}
function preview(rows){
  const seen=new Set();
  PARSED=rows.map(r=>{
    const o={...r};
    if(!r.code||!Number.isFinite(r.qty)) o.err='缺項次或數量';
    else o.err=validate(r.period,r.code,r.part,r.qty);
    const dk=r.period+'|'+r.code+'|'+r.part+'|'+r.qty;
    o.dup=LOGS.some(l=>l.period===r.period&&l.code===r.code&&l.part===r.part&&Math.abs((+l.qty||0)-r.qty)<1e-6)
        || seen.has(dk);
    seen.add(dk);
    o.isNew=!o.err&&!C.some(c=>c.code===r.code&&c.part===r.part);
    o.ok=!o.err&&!o.dup;
    return o;
  });
  const n=PARSED.filter(r=>r.ok).length, nd=PARSED.filter(r=>r.dup).length, ne=PARSED.filter(r=>r.err).length;
  document.getElementById('impPrev').innerHTML=
   `<div class="ihead">讀到 <b>${PARSED.length}</b> 列　│　可匯入 <b style="color:var(--done)">${n}</b>`+
   (nd?`　│　重複略過 <b style="color:var(--muted)">${nd}</b>`:'')+
   (ne?`　│　有問題 <b style="color:var(--over)">${ne}</b>`:'')+`</div>`+
   `<div class="itbl"><table><thead><tr><th>期別</th><th>項次</th><th>結構物</th><th>數量</th><th>備註</th><th>判定</th></tr></thead><tbody>`+
   PARSED.map(r=>`<tr><td class="c">${esc(r.period)}</td><td class="c">${esc(r.code)}</td>
     <td>${esc(r.part)}</td><td class="r">${Number.isFinite(r.qty)?qty(r.qty):'—'}</td>
     <td style="color:var(--muted)">${esc((r.note||'').slice(0,20))}</td>
     <td>${r.err?`<span class="pill p-over">${esc(r.err.slice(0,30))}</span>`
        :r.dup?`<span class="pill p-none">重複，略過</span>`
        :r.isNew?`<span class="pill p-pend">可匯入（新結構物）</span>`
        :`<span class="pill p-done">可匯入</span>`}</td></tr>`).join('')+
   `</tbody></table></div>`;
  const b=document.getElementById('btnDoImp');
  b.disabled=!n; b.textContent='匯入 '+n+' 筆';
  impMsg.className='msg';
}
document.getElementById('impFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const err=t=>{impMsg.className='msg err';impMsg.textContent=t;};
  try{
    if(/\.xlsx$/i.test(f.name)){
      if(typeof DecompressionStream==='undefined') return err('這個瀏覽器不支援直接讀 .xlsx，請改用貼上，或在 Excel 另存成 CSV。');
      const {sheets,grid}=await xlsxSheets(await f.arrayBuffer());
      const vis=sheets.filter(s=>!s.hidden);

      sel.style.display=''; sel.innerHTML=vis.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');

      sel.onchange=()=>load(+sel.value);

      let pick=0;

      sel.value=pick; await load(pick);
    } else {
      preview(mapRows(parseDelim(await f.text())));

  e.target.value='';
};

document.getElementById('btnDoImp').onclick=async()=>{
  const rows=PARSED.filter(r=>r.ok);
  if(!rows.length) return;
  const b=document.getElementById('btnDoImp'); b.disabled=true; b.textContent='匯入中…';
  let ok=0, fail=0;
  for(const r of rows){
    const e2=validate(r.period,r.code,r.part,r.qty);   // 逐筆重驗（前一筆可能改變累計）
    if(e2){ r.err=e2; r.ok=false; fail++; continue; }
    try{ await pushLog({period:r.period,code:r.code,part:r.part,qty:r.qty,note:r.note||'',at:new Date().toISOString()}); ok++; }
    catch(e){ fail++; r.err='寫入失敗'; r.ok=false; }
  }
  refresh();
  impMsg.className='msg ok';
  impMsg.textContent='已匯入 '+ok+' 筆'+(fail?('，'+fail+' 筆因為會超過施工圖／合約或寫入失敗而跳過'):'')+'。';
  preview(PARSED);
};

/* ---- 初始化 ---- */
document.getElementById('fGroup').innerHTML='<option value="">全部結構群組</option>'+
  D.groups.filter(g=>!SPECIAL(g)).sort(gcmp).map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
document.getElementById('fComp').innerHTML='<option value="">全部構件</option>'+
  COMPS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
refresh(); syncParts();
(async()=>{
  if(typeof claude==='undefined'||!claude.use) return;
  db=await claude.use('db');
  if(!db) return;
  try{
    db.collection('logs').onSnapshot(snap=>{
      LOGS=snap.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(l=>l&&l.code&&l.part)
            .sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
      refresh();
    }, err=>{ console.log('db snapshot error', err && err.code); });
  }catch(e){}
  try{
    db.doc('prefs/hidden').onSnapshot(d=>{
      const v=d&&d.data&&d.data();
      HID=new Set((v&&v.keys)||[]);
      refresh();
    }, ()=>{});
  }catch(e){}
})();

</script>
